services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: relayforge
      POSTGRES_PASSWORD: relayforge_dev
      POSTGRES_DB: relayforge
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U relayforge -d relayforge']
      interval: 2s
      timeout: 2s
      retries: 20
