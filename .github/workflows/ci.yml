name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:boundaries
      - run: pnpm scan:secrets
      - run: pnpm benchmark:validate
      - run: pnpm test
      - run: pnpm build
      - name: Generate source manifest
        run: pnpm manifest:source > source-manifest.json
      - name: Upload source manifest
        uses: actions/upload-artifact@v4
        with:
          name: relayforge-source-manifest-${{ github.sha }}
          path: source-manifest.json
          if-no-files-found: error
